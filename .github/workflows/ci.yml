name: tests

on: [push]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres: 
        image: postgres:16
        env: 
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: todo_api_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" 
          --health-interval 2s 
          --health-timeout 3s 
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: go mod download

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run Migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: "postgres://postgres:password@localhost:5432/todo_api_test?sslmode=disable"
          GOOSE_MIGRATION_DIR: migrations
        run: goose up

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...
        env:
          TEST_DATABASE_URL: "postgres://postgres:password@localhost:5432/todo_api_test?sslmode=disable"

