services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_api
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    image: golang:1.26
    volumes: 
      - ./migrations:/migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:password@db:5432/todo_api?sslmode=disable
    command: go run github.com/pressly/goose/v3/cmd/goose@latest -dir /migrations up
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file:
      - .env
    environment:
      SERVER_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:password@db:5432/todo_api?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:                               
        condition: service_completed_successfully


volumes:
  pgdata: